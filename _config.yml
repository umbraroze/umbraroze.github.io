title: Umbrarose's Adventures in Software Development
email: wwwwolf@iki.fi
description: >-
  Random code thingies from a weird developer called Rose. These can get
  sorta unusual and stuff.
domain: umbraroze.github.io
baseurl: /
url: https://umbraroze.github.io
github_username: umbraroze
show_downloads: false


copyright: "Rose Midford"
author:
  name: "Rose Midford"
  location: "Oulu, Finland"
  email: "wwwwolf@iki.fi"
  fediverse: "@umbraroze@tech.lgbt"
  links:
    - label: "Mastodon"
      icon: "fab fa-fw fa-mastodon"
      url: https://tech.lgbt/@umbraroze
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: https://github.com/umbraroze
    - label: "Codeberg"
      icon: "fab fa-fw fa-forgejo"
      url: https://codeberg.org/umbraroze
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: https://github.com/umbraroze
    - label: "Codeberg"
      icon: "fab fa-fw fa-forgejo"
      url: https://codeberg.org/umbraroze

include:
 - .nojekyll

collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:title:output_ext

# Build settings
plugins:
  - jekyll-feed

# THEME SETTINGS
# For remote theme documentation:
#  https://mmistakes.github.io/minimal-mistakes/docs/quick-start-guide/
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "sunrise"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      author_profile: true
